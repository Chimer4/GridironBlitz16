name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          unzip -o "*.zip"
          cd GridironBlitz16-Android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GridironBlitz16.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GridironBlitz16-apk
          path: GridironBlitz16.apk
